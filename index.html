<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#F3EEE3" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ねむりノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/sleep-180.png">
<link rel="icon" type="image/png" href="icons/sleep-192.png">
<link rel="manifest" href="manifest.json">
<title>ねむりノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: a calm family board. Colours come from the daughter's character (cream, olive, matcha). Member cards, then the week's paw stamps, then rewards; tab bar at the bottom. Evenings switch to a deep olive night palette. */
:root{
  --bg:#F3EEE3; --surface:#FFFDF8; --surface-2:#F0EADD; --ink:#2F2A22; --ink-2:#5C5447; --muted:#82796A; --line:#E3DBCC;
  --accent:#5D6B26; --on-accent:#FFFCF2; --wash:#E7EBD2; --stamp:#5D6B26; --gauge:#8CA23F; --warn:#B4505B;
  --m0:#6E8A26; --m1:#3B76B0; --m2:#C25F6A;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --r:16px;
  color-scheme:light;
}
html.night{
  --bg:#171A14; --surface:#22261D; --surface-2:#2C3125; --ink:#F1ECDF; --ink-2:#CFC8B6; --muted:#9C9583; --line:#383E2F;
  --accent:#B7C873; --on-accent:#1D2114; --wash:#343B27; --stamp:#C3D37F; --gauge:#B7C873; --warn:#E08A93;
  --m0:#84993A; --m1:#5B93CC; --m2:#CC737D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:500;font-size:16px;line-height:1.65;line-break:strict;word-break:normal;word-break:auto-phrase;-webkit-font-smoothing:antialiased;transition:background-color .6s,color .6s}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}
[hidden]{display:none!important}
.app{max-width:1080px;margin:0 auto;padding:10px 20px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand img{width:44px;height:44px;object-fit:contain}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:24px;margin:0;letter-spacing:.06em}
.brand .date{color:var(--muted);font-weight:500;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.chip svg{width:15px;height:15px}
.banner{background:var(--wash);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:12px 12px 12px 22px;margin-bottom:16px}
.hero .hl{font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.45;margin:0;text-wrap:balance}
.hero .sub{margin:4px 0 0;color:var(--ink-2);font-size:15px}
.hero img{width:124px;height:110px;object-fit:contain}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.mcard{box-shadow:inset 0 4px 0 var(--mc)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mname{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px;min-width:0}
.mname .nm{overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mc);flex:none}
.pencil{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.pencil:hover{background:var(--surface-2);color:var(--ink)}
.pencil svg{width:17px;height:17px}
.lv{font-size:12px;font-weight:700;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.last{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;margin:0;font-size:15px}
.last dt{color:var(--muted)}
.last dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.paws{display:inline-flex;gap:2px;vertical-align:-3px}
.paws svg{width:17px;height:17px}
.goal{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 12px}
.goal b{color:var(--ink);font-variant-numeric:tabular-nums}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);font-weight:700}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:15px;height:15px;color:var(--accent)}
.sleeping{display:flex;gap:12px;align-items:center;background:var(--wash);border-radius:12px;padding:8px 12px}
.sleeping img{width:76px;height:60px;object-fit:contain;flex:none}
.sleeping b{display:block;font-size:15px}
.sleeping span{font-size:13px;color:var(--ink-2)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.btn{appearance:none;border:0;border-radius:12px;min-height:52px;padding:10px 14px;font-weight:700;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--ink);transition:transform .08s,background-color .2s}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.small{min-height:40px;font-size:14px;border-radius:10px;padding:6px 14px}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:transparent;box-shadow:inset 0 0 0 1px var(--warn);color:var(--warn)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.35;cursor:default}
section.block{margin-top:26px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
h2{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0;text-wrap:balance}
.panel{background:var(--surface);border-radius:var(--r);padding:16px}
.scroll-x{overflow-x:auto}
.wtable{display:grid;grid-template-columns:104px repeat(7,minmax(38px,1fr));gap:8px 6px;align-items:center;min-width:450px}
.wtable .h{font-size:12px;color:var(--muted);text-align:center;line-height:1.3;font-variant-numeric:tabular-nums}
.wtable .h.today{color:var(--ink);font-weight:700}
.wtable .who{font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtable .who svg{width:15px;height:15px;color:var(--accent)}
.slot{width:100%;max-width:40px;aspect-ratio:1;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.slot.on{background:var(--wash)}
.slot.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.slot svg{width:62%;height:62%}
.rewards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.rcard h3{font-size:14px;margin:0;font-weight:700;color:var(--muted)}
.rcard .big{font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.4}
.pips{display:flex;gap:8px}
.pip{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.pip.on{background:var(--wash)}
.pip svg{width:20px;height:20px}
.gauge{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.gauge>i{display:block;height:100%;background:var(--gauge);border-radius:999px;transition:width 1s ease}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
.pal-mini{display:flex;gap:14px;align-items:center}
.pal-mini img{width:92px;height:84px;object-fit:contain;flex:none}
.badgelist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.job{align-self:flex-start;border:0;background:var(--wash);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.job{padding:3px 12px 3px 4px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .acts .btn{min-height:46px}
.hero .sub2{margin:6px 0 0;font-size:14px;color:var(--muted)}
.checkline{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center;font-size:13px}
.checkline .lbl{color:var(--muted);font-weight:700;margin-right:2px}
.checkline span.c{background:var(--surface-2);border-radius:999px;padding:2px 10px;font-weight:700}
.checkline span.c.ok{background:var(--wash)}
.tut{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;overflow:auto}
.tut.open{display:block}
.tut-inner{max-width:720px;margin:0 auto;padding:18px 20px 0;display:flex;flex-direction:column;gap:16px;min-height:100%}
.tut-top{display:flex;align-items:center;gap:14px}
.tut-top .steps{flex:1;display:flex;gap:6px}
.tut-top .steps i{flex:1;height:6px;border-radius:999px;background:var(--line)}
.tut-top .steps i.on{background:var(--accent)}
.tut-top .cnt{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.tut-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.tut-head h2{font-size:26px;line-height:1.4}
.tut-head .lead{margin:6px 0 0;color:var(--ink-2);font-size:15px}
.tut-head img{width:150px;height:130px;object-fit:contain}
.tut-card{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.tut-card.mc{box-shadow:inset 4px 0 0 var(--mc)}
.tut-card h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.calc{font-size:15px;background:var(--surface-2);border-radius:10px;padding:8px 12px}
.calc b{font-size:18px;font-variant-numeric:tabular-nums}
.warnline{color:var(--warn);font-size:13px;margin:0}
.olist{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:16px}
.menu-edit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.menu-edit li{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:10px;padding:6px 6px 6px 12px;font-size:15px}
.menu-edit li span{flex:1}
.menu-edit .x{border:0;background:transparent;width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.sumtbl{width:100%;border-collapse:collapse;font-size:15px}
.sumtbl th{font-size:12px;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.sumtbl td{padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.promise{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.promise li{display:flex;gap:12px;align-items:flex-start;font-size:16px;font-weight:700;line-height:1.5}
.promise li svg{width:22px;height:22px;flex:none;margin-top:2px}
.tut-nav{position:sticky;bottom:0;margin-top:auto;background:linear-gradient(to bottom,transparent,var(--bg) 30%);padding:18px 0 calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:space-between}
.tut-nav .btn{min-width:130px}
.prep-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prep-list{display:flex;flex-direction:column;gap:8px}
img.photo{border-radius:16px;object-fit:cover !important}
.avatar{width:42px;height:42px;object-fit:contain;flex:none;margin-right:2px}
.moods .btn img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 35%;background:var(--wash)}
.roleimg img{width:76px;height:76px;object-fit:contain;display:block}
.avbtn{border:0;background:var(--surface-2);border-radius:14px;padding:4px;cursor:pointer;flex:none}
.avbtn img{width:60px;height:60px;object-fit:contain;display:block}
.meta button{border:0;background:transparent;padding:0;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-weight:700}
.ti{display:inline-grid;place-items:center;border-radius:30%;flex:none}
.ti svg{width:62%;height:62%}
.prow{appearance:none;border:0;width:100%;text-align:left;cursor:pointer;background:var(--surface-2);color:var(--ink);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:44px minmax(0,1fr) auto 34px;grid-template-areas:"i n w c" "i s s c";gap:0 12px;align-items:center}
.prow .ti{grid-area:i}
.prow .pc{grid-area:c;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;background:var(--surface)}
.prow .pc svg{width:18px;height:18px;color:var(--on-accent)}
.prow .pn{grid-area:n;font-weight:700;font-size:16px}
.prow .pn em{font-style:normal;font-size:12px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.prow .pw{grid-area:w;font-size:12px;color:var(--muted);font-weight:700}
.prow .ps{grid-area:s;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.prow .ps.over{color:var(--warn)}
.prow.done{background:var(--wash)}
.prow.done .pc{background:var(--accent);box-shadow:none}
.prow.done .pn{color:var(--ink-2)}
.prow.done .ti{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.prow.next{box-shadow:inset 0 0 0 2px var(--accent)}
.prow.free{cursor:default;background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.prep-bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prep-bar>i{display:block;height:100%;background:var(--gauge);border-radius:999px;transition:width .6s ease}
.pe{display:grid;grid-template-columns:34px 44px minmax(0,1fr) 110px 110px 92px 28px 36px;grid-template-areas:"m i n d w t o x";gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pe:last-child{border-bottom:0}
.pe.off{opacity:.5}
.pe .m{grid-area:m;display:flex;flex-direction:column;gap:2px}
.pe .m button{border:0;background:var(--surface-2);border-radius:6px;width:30px;height:22px;cursor:pointer;color:var(--ink-2);display:grid;place-items:center;padding:0}
.pe .m button svg{width:14px;height:14px}
.pe .m button[disabled]{opacity:.3;cursor:default}
.pe .ib{grid-area:i;border:0;background:transparent;padding:0;cursor:pointer;border-radius:12px}
.pe .n{grid-area:n}.pe .d{grid-area:d}.pe .w{grid-area:w}.pe .o{grid-area:o}.pe .x{grid-area:x}
.pe .t{grid-area:t;font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.3}
.pe .t small{display:block;font-weight:500;color:var(--muted)}
.pe .x{border:0;background:transparent;width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
@media (max-width:700px){.pe{grid-template-columns:34px 44px minmax(0,1fr) minmax(0,1fr) 28px 36px;grid-template-areas:"m i n n o x" "m d d w w w" "m t t t t t";row-gap:6px}.pe .t small{display:inline;margin-left:8px}}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent)}
.prep-stats td.late{color:var(--warn);font-weight:700}
.prep-stats .ti{vertical-align:middle;margin-right:4px}
.prep-stats td.ok{color:var(--accent);font-weight:700}
.badgelist div{display:flex;align-items:center;gap:8px;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .inner{display:grid;grid-template-columns:repeat(5,1fr);max-width:620px;width:100%;gap:4px}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted);border-radius:12px;cursor:pointer;min-height:52px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--surface-2)}
nav.tabs svg{width:22px;height:22px}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;display:flex;gap:6px;align-items:center;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.weeknav{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px}
.weeknav .btn{min-height:40px;width:40px;padding:0;border-radius:50%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border-radius:14px;padding:12px 14px}
.tile .l{font-size:12px;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.3}
.tile .dl{font-size:12px;color:var(--ink-2);font-weight:700;margin-top:2px}
.cal .c .cs{font-size:11px;color:var(--muted);font-weight:700;line-height:1}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;width:max-content}
.hc{display:inline-block;width:13px;height:13px;border-radius:3px;background:var(--stamp)}
.hc.none{background:transparent}
.hc.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.tile .v small{font-size:13px;margin-left:3px;font-family:var(--font-body)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.chartcard h3{margin:0 0 2px;font-size:15px}
.chartcard .cap{margin:0 0 8px;font-size:12px;color:var(--muted)}
.chart{position:relative}
.chart svg{display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chart .xl{fill:var(--ink-2);font-size:12px;font-variant-numeric:tabular-nums}
.chart .xl.we{fill:var(--accent);font-weight:700}
.chart .ref{stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.chart .ref2{stroke:var(--muted);stroke-width:1.5}
.chart .rl{fill:var(--ink-2);font-size:12px;font-weight:700}
.chart .vl{fill:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.chart .bandhl{fill:var(--surface-2);opacity:0}
.chart .bandhl.active{opacity:1}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;min-width:560px}
.tbl th{font-size:12px;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line)}
.tbl td.num{text-align:right}
.tbl svg{width:18px;height:18px;vertical-align:-4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:12px;text-align:center;color:var(--muted);font-weight:700}
.cal .c{aspect-ratio:1;max-height:84px;background:var(--surface-2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-variant-numeric:tabular-nums;gap:1px;min-width:0}
.cal .c.blank{background:transparent}

<div class="app">

<script>
(function(){
'use strict';

/* ---------- 基本ユーティリティ ---------- */
const KEY = 'nemuri-note-v1';
const DAYS = ['日','月','火','水','木','金','土'];
const pad = n => String(n).padStart(2,'0');
const dstr = dt => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const dparse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = dparse(s); d.setDate(d.getDate()+n); return dstr(d); };
const diffDays = (a,b) => Math.round((dparse(b) - dparse(a)) / 86400000);
const today = () => dstr(new Date());
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 時刻は「その夜の日付の正午から何分後か」で持つ。21:15→555、0:30→750、翌6:30→1110 */
const clockToOff = hhmm => { const [h,m] = hhmm.split(':').map(Number); const t = h*60+m; return t >= 720 ? t-720 : t+720; };
const offToClock = o => { let t = (Math.round(o) + 720) % 1440; if (t < 0) t += 1440; return `${pad(Math.floor(t/60))}:${pad(t%60)}`; };
const noonOf = d => { const x = dparse(d); x.setHours(12,0,0,0); return x; };
const offAt = (d, dt) => Math.round((dt - noonOf(d)) / 60000);
const nightOf = dt => dt.getHours() < 12 ? addDays(dstr(dt), -1) : dstr(dt);
const lastNight = () => { const n = new Date(); return n.getHours() < 5 ? addDays(today(), -2) : addDays(today(), -1); };
const tonight = () => { const n = new Date(); return n.getHours() < 5 ? addDays(today(), -1) : today(); };
const durText = min => { const h = Math.floor(min/60), m = min % 60; return m ? `${h}時間${m}分` : `${h}時間`; };
const durShort = min => `${Math.floor(min/60)}:${pad(min%60)}`;
const mdText = s => { const d = dparse(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const mdwText = s => { const d = dparse(s); return `${d.getMonth()+1}/${d.getDate()}（${DAYS[d.getDay()]}）`; };
const isWeekendNight = d => { const w = dparse(d).getDay(); return w === 5 || w === 6; };
const round5 = x => Math.round(x/5)*5;
const avg = a => a.length ? a.reduce((s,v)=>s+v,0)/a.length : null;
const minusClock = (hhmm, min) => { const [h,m] = hhmm.split(':').map(Number); let t = ((h*60 + m - min) % 1440 + 1440) % 1440; return `${pad(Math.floor(t/60))}:${pad(t%60)}`; };

/* ---------- 役 ---------- */
const JOBS = {
  leader:{name:'おやすみリーダー', task:'夜、「おやすみタイム」をアプリで宣言して、家族みんなにねる準備の合図を出す'},
  check: {name:'朝のチェック係',   task:'朝、3人の「おはよう」が押されたか確かめて、押し忘れた人に声をかける'},
  charge:{name:'充電台係',         task:'おやすみタイムになったら、家族のiPadとスマホを充電台に集める'},
  reward:{name:'ごほうび係',       task:'週のごほうびと、月のイベントの準備をする'},
  cheer: {name:'応援係',           task:'うまくいった朝に「よくできたね」と声をかける'},
  custom:{name:'自分で決める',     task:''}
};
const jobName = m => m.job === 'custom' ? (m.jobName || '自分で決めた役') : (JOBS[m.job] || JOBS.cheer).name;
const jobTask = m => m.job === 'custom' ? (m.jobTask || 'やることを決めよう') : (JOBS[m.job] || JOBS.cheer).task;
const jobOpts = cur => Object.keys(JOBS).map(k => `<option value="${k}" ${k === cur ? 'selected' : ''}>${JOBS[k].name}</option>`).join('');
const sleepOpts = cur => { let o = ''; for (let mm = 360; mm <= 660; mm += 15) o += `<option value="${mm}" ${mm === cur ? 'selected' : ''}>${Math.floor(mm/60)}時間${mm%60 ? (mm%60) + '分' : ''}</option>`; return o; };
const leaders = () => S.members.filter(m => m.job === 'leader');

/* ---------- 夜のじゅんび ---------- */
/* 上から順番にやる。いちばん下のじゅんびが「おやすみタイム」におわるように、かかる時間から逆算して締め切りを出す */
const PREP_DEFAULT = [
  {id:'hw',    name:'宿題',               dur:30, who:'m1',     icon:'hw'},
  {id:'bath',  name:'お風呂を出る',       dur:25, who:'m1',     icon:'bath'},
  {id:'pjs',   name:'パジャマに着がえる', dur:5,  who:'m1',     icon:'pjs'},
  {id:'dinS',  name:'ごはんスタート',     dur:15, who:'adults', icon:'dinS'},
  {id:'dinE',  name:'ごはんおしまい',     dur:35, who:'m1',     icon:'dinE'},
  {id:'free',  name:'自由時間',           dur:40, who:'all',    icon:'free', kind:'free'},
  {id:'teeth', name:'歯みがき',           dur:10, who:'m1',     icon:'teeth'}
];
function defaultPrep(){ return PREP_DEFAULT.map(t => Object.assign({on:true}, t)); }
function prepChain(tasks, anchor){
  const on = (tasks || []).filter(t => t.on), out = [];
  let cur = clockToOff(anchor);
  for (let i = on.length - 1; i >= 0; i--){ const t = on[i]; out.unshift(Object.assign({}, t, {dl: offToClock(cur), from: offToClock(cur - t.dur)})); cur -= t.dur; }
  return out;
}
const prepAll = () => prepChain(S.prep.tasks, S.declareTime);
const prepTasks = () => prepAll().filter(t => t.kind !== 'free');
const whoName = t => t.who === 'adults' ? 'おとな' : t.who === 'all' ? 'みんな' : ((member(t.who) || {}).name || '');
function prepOK(night){
  const kid = child().id, T = prepTasks().filter(t => t.who === kid), L = (S.prep.log || {})[night] || {};
  if (!T.length || T.some(t => L[t.id] == null)) return false;
  const limit = Math.max(clockToOff(S.declareTime), ...T.map(t => clockToOff(t.dl)));
  return Math.max(...T.map(t => L[t.id])) <= limit;
}

/* アイコン（パステルのタイル） */
const TI = {
  hw:    {bg:'#E9E2F7', fg:'#6650B5', d:'<path d="M4 17.6V20h2.4L16.9 9.5l-2.4-2.4z"/><path d="M15.6 6l2.4 2.4 1.3-1.3a1 1 0 0 0 0-1.4L18.2 4.6a1 1 0 0 0-1.4 0z"/><path d="M3 21.5h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>'},
  dinS:  {bg:'#FBE5CC', fg:'#B2601A', d:'<path d="M3 12h18c0 4.4-4 7.5-9 7.5S3 16.4 3 12z"/><path d="M8.5 9.5c-.9-1.2.9-2 0-3.3M12 9.5c-.9-1.2.9-2 0-3.3M15.5 9.5c-.9-1.2.9-2 0-3.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>'},
  dinE:  {bg:'#FBE5CC', fg:'#B2601A', d:'<path d="M3 13h18c0 4-4 6.8-9 6.8S3 17 3 13z"/><path d="M13 11 20 4.2M10.5 11 17.8 3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>'},
  bath:  {bg:'#D9EAF8', fg:'#2D6CA6', d:'<path d="M2.5 12h19v1.6a5.4 5.4 0 0 1-5.4 5.4H7.9a5.4 5.4 0 0 1-5.4-5.4z"/><path d="M5.5 12V6.3a2.3 2.3 0 0 1 4.4-.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="14" cy="8.5" r="1.5"/><circle cx="17.5" cy="6" r="1.1"/><circle cx="17.8" cy="9.6" r=".9"/><path d="M6.5 19 5.6 21M17.5 19l.9 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'},
  pjs:   {bg:'#F7DFE6', fg:'#AD4864', d:'<path d="M8.2 3.2 3 6.1l2 4.2 2.2-1.1V21h9.6V9.2l2.2 1.1 2-4.2-5.2-2.9c-.6 1.6-2 2.5-3.8 2.5s-3.2-.9-3.8-2.5z"/><circle cx="12" cy="11" r=".9" fill="#fff"/><circle cx="12" cy="14.2" r=".9" fill="#fff"/><path d="M18.5 3.5a2.2 2.2 0 1 0 2 3 2.6 2.6 0 0 1-2-3z" />'},
  futon: {bg:'#EEE6D6', fg:'#7A5D2E', d:'<rect x="3" y="6.5" width="8" height="4.5" rx="2"/><path d="M3 12.5h18v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M7 15.8h10" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>'},
  teeth: {bg:'#D9F0E8', fg:'#2B8668', d:'<path d="M7.3 3.5c-2.6 0-4.1 2-4.1 4.5 0 2.9 1.5 4.6 2 7.6.4 2.5 1 5 2.5 5s1.9-3.9 4.3-3.9 2.8 3.9 4.3 3.9 2.1-2.5 2.5-5c.5-3 2-4.7 2-7.6 0-2.5-1.5-4.5-4.1-4.5-2 0-2.9 1-4.7 1s-2.7-1-4.7-1z"/><path d="M8.3 7.2c.4-.9 1.2-1.3 2.1-1.3" stroke="#fff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity=".8"/>'},
  free:  {bg:'#F6EBC2', fg:'#987210', d:'<path d="M12 2.8l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z"/>'},
  bell:  {bg:'#F4E5BE', fg:'#85600F', d:'<path d="M12 3a5.6 5.6 0 0 0-5.6 5.6v3.6L4.8 15.6V17h14.4v-1.4l-1.6-3.4V8.6A5.6 5.6 0 0 0 12 3zM9.8 18.2a2.2 2.2 0 0 0 4.4 0z"/>'},

  plug:  {bg:'#D9F0E8', fg:'#2B8668', d:'<rect x="2.5" y="7.5" width="16" height="9" rx="2"/><rect x="19.2" y="10.2" width="2.3" height="3.6" rx=".8"/><path d="M11.3 8.8 7.8 12.6h3l-1 3.1 3.9-4h-3z" fill="#fff"/>'},
  gift:  {bg:'#F7DFE0', fg:'#A8424E', d:'<rect x="3.5" y="9" width="17" height="3.6" rx="1"/><rect x="5" y="12.6" width="14" height="8" rx="1"/><rect x="11" y="9" width="2" height="11.6" fill="#fff" opacity=".85"/><path d="M12 9c-1.3-3-5.4-4.1-5.4-1.6S10 9 12 9zm0 0c1.3-3 5.4-4.1 5.4-1.6S14 9 12 9z"/>'},
  heart: {bg:'#F7DFE6', fg:'#AD4864', d:'<path d="M12 20.3s-8.2-4.7-8.2-10.4A4.4 4.4 0 0 1 12 7.2a4.4 4.4 0 0 1 8.2 2.7c0 5.7-8.2 10.4-8.2 10.4z"/>'},
  paw:   {bg:'#E7EBD2', fg:'#5D6B26', d:'<path d="M12 11.2c3.2 0 5.6 2.6 5.6 5 0 1.9-1.6 3-3.3 3-1 0-1.6-.5-2.3-.5s-1.3.5-2.3.5c-1.7 0-3.3-1.1-3.3-3 0-2.4 2.4-5 5.6-5zM5.8 7.6a2.1 2.5 0 1 1 0 5 2.1 2.5 0 0 1 0-5zM18.2 7.6a2.1 2.5 0 1 1 0 5 2.1 2.5 0 0 1 0-5zM9.3 3.6a2.2 2.6 0 1 1 0 5.2 2.2 2.6 0 0 1 0-5.2zM14.7 3.6a2.2 2.6 0 1 1 0 5.2 2.2 2.6 0 0 1 0-5.2z"/>'}
};
const ICON_CYCLE = ['hw','dinS','dinE','bath','pjs','futon','teeth','free','paw','gift','heart','bell'];

const checkOn = (s=22) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" aria-hidden="true"><path d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6 11-11-1.4-1.4z" fill="var(--stamp)"/></svg>`;

/* ---------- 状態 ---------- */
const PAL_DEFAULT = 'ねむねこ';
function freshState(){
  return {
    v:2, demo:false, start: today(),
    members:[
      {id:'m1', name:'こども', role:'child',  lo:'21:15', sleep:540, wake:'06:30', job:'leader'},
      {id:'m2', name:'パパ',   role:'parent', lo:'23:00', sleep:420, wake:'06:30', job:'reward'},
      {id:'m3', name:'ママ',   role:'parent', lo:'22:45', sleep:420, wake:'06:15', job:'cheer'}
    ],
    declareTime:'20:45', declares:{}, onboarded:false,
    prep:{v:3, tasks: defaultPrep(), log:{}},
    entries:{m1:{}, m2:{}, m3:{}},

function scoreOf(m, d, e){
  if (!e || e.lo == null || e.wk == null) return null;
  const we = isWeekendNight(d);
  const late = Math.max(0, e.lo - (clockToOff(m.lo) + (we ? 30 : 0)));
  const sLo = Math.max(0, 50 - 5*Math.floor(late/10));
  const dur = e.wk - e.lo;
  const short = Math.max(0, m.sleep - dur);
  const sSl = Math.max(0, 40 - 5*Math.floor(short/15));
  const diff = e.wk - clockToOff(m.wake);
  const okW = we ? (diff >= -30 && diff <= 90) : Math.abs(diff) <= 30;
  const sWk = okW ? 10 : 0;
  return {total: sLo + sSl + sWk, sLo, sSl, sWk, dur, late};
}

}

/* すべての集計。upto＝評価する最後の夜（既定は「ゆうべ」） */
function analyze(uptoArg){
  const upto = uptoArg || lastNight();
  const displayTo = uptoArg ? uptoArg : tonight();
  const curWeek = Math.max(0, weekIndex(today()));
  const nights = [];
  for (let d = S.start; d <= displayTo; d = addDays(d,1)) nights.push(d);
  const out = {upto, curWeek, members:{}, family:{}};
  for (const m of S.members){
    const E = S.entries[m.id] || (S.entries[m.id] = {});
    const final = clockToOff(m.lo);
    const steps = [null];
    const stampAt = d => {
      const wi = weekIndex(d); if (wi < 0) return false;
      const e = E[d]; if (!e || e.lo == null || e.wk == null) return false;
      if (wi === 0) return true;
      const t = steps[wi]; if (t == null) return false;
      return e.lo <= t + (isWeekendNight(d) ? 30 : 0);
    };
    const lastW = Math.max(curWeek, weekIndex(displayTo));
    for (let i = 1; i <= lastW; i++){
      if (i === 1){
        const arr = [];
        for (let k = 0; k < 7; k++){ const d = addDays(S.start,k), e = E[d]; if (e && e.lo != null) arr.push(e.lo - (isWeekendNight(d) ? 30 : 0)); }
        steps[1] = arr.length ? Math.max(final, round5(avg(arr) - 15)) : final;
      } else {
        let c = 0; for (let k = 0; k < 7; k++) if (stampAt(addDays(S.start, (i-1)*7 + k))) c++;
        steps[i] = c >= 4 ? Math.max(final, steps[i-1] - 15) : steps[i-1];
      }
    }
    const stamp = {}, score = {};
    let records = 0, stamps = 0, goalStamps = 0, maxScore = 0, bestUpd = 0, prevMax = -1, scored = 0, early = 0, fullMoon = 0, points = 0;
    for (const d of nights){
      const e = E[d];
      stamp[d] = stampAt(d);
      const sc = scoreOf(m, d, e); if (sc) score[d] = sc;
      if (d > upto) continue;
      if (e && (e.lo != null || e.wk != null)) records++;
      if (stamp[d]){ stamps++; if (weekIndex(d) >= 1) goalStamps++; }
      if (sc){
        points += sc.total;
        if (scored >= 3 && sc.total > prevMax) bestUpd++;
        prevMax = Math.max(prevMax, sc.total); scored++;
        maxScore = Math.max(maxScore, sc.total);
      }
      if (e && e.lo != null){
        const wi = weekIndex(d);
        const base = (wi >= 1 && steps[wi] != null) ? steps[wi] : final;
        if (e.lo <= base + (isWeekendNight(d) ? 30 : 0) - 30) early++;
      }
      if (stamp[d] && isFullMoon(d)) fullMoon++;
    }
    let streak = 0, maxStreak = 0; const ticketUsed = {};
    for (const d of nights){
      if (d > upto) break;
      const e = E[d], wi = weekIndex(d);
      if (d === upto && (!e || e.wk == null)) break;
      if (stamp[d]){ streak++; maxStreak = Math.max(maxStreak, streak); }
      else if (!ticketUsed[wi]) ticketUsed[wi] = d;
      else streak = 0;
    }
    let weekendBoth = 0;
    for (const d of nights){
      if (d > upto) break;
      if (dparse(d).getDay() === 5){ const s = addDays(d,1); if (s <= upto && stamp[d] && stamp[s]) weekendBoth++; }
    }
    const declares = Object.keys(S.declares || {}).filter(d => d <= displayTo && S.declares[d].mid === m.id).length;
    const prep = m.id === child().id ? nights.filter(d => prepOK(d)).length : 0;
    out.members[m.id] = {m, final, steps, stamp, score, records, stamps, goalStamps, maxScore, bestUpd, early, fullMoon, points, lv: levelOf(points), streak, maxStreak, ticketUsed, weekendBoth, declares, prep};
  }
  let familyCount = 0, all100 = 0;
  for (const d of nights){
    const all = S.members.every(m => out.members[m.id].stamp[d]);
    out.family[d] = all;
    if (d <= upto){
      if (all) familyCount++;
      if (S.members.every(m => { const sc = out.members[m.id].score[d]; return sc && sc.total === 100; })) all100++;
    }
  }
  for (const m of S.members){ out.members[m.id].family = familyCount; out.members[m.id].all100 = all100; }
  return out;
}

  olive:{bg:'#E3E8CC',fg:'#4F5E1C'}, matcha:{bg:'#DCEAC2',fg:'#3E671D'}, rose:{bg:'#F4DADB',fg:'#9A3E49'},
  blue:{bg:'#D8E5F2',fg:'#2C5D8C'}, gold:{bg:'#F3E4BC',fg:'#85600F'}, brown:{bg:'#EEDFCB',fg:'#6C4A29'}, night:{bg:'#2F3524',fg:'#E4DDA4'}
};
function glyph(icon, fg){
  const [k, n] = icon.split(':');
  const g = d => `<g transform="translate(17 16) scale(1.25)"><path d="${d}" fill="${fg}"/></g>`;
  const num = (v, y, fs) => `<text x="32" y="${y}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${fg}" font-family="Zen Maru Gothic, sans-serif">${v}</text>`;
  switch (k){
    case 'n': return `<g transform="translate(25.5 9) scale(.55)"><path d="${PAW}" fill="${fg}"/></g>` + num(n, 45, String(n).length >= 3 ? 16 : 20);
    case 'paw': return g(PAW);
    case 'check': return n ? `<g transform="translate(22 9) scale(.85)"><path d="${P.check}" fill="${fg}"/></g>` + num(n, 49, 12) : g(P.check);
    case 'bell': return n ? `<g transform="translate(22 9) scale(.85)"><path d="${P.bell}" fill="${fg}"/></g>` + num(n, 49, 12) : g(P.bell);
    case 'flame': return `<g transform="translate(22 10) scale(.85)"><path d="${P.flame}" fill="${fg}"/></g>` + num(n, 49, 12);
    case 'house': return n ? `<g transform="translate(22 11) scale(.85)"><path d="${P.house}" fill="${fg}"/></g>` + num(n, 49, 12) : g(P.house);
    case 'up': return g(P.up);
    case 'crown': return g(P.crown);
    case 'moon': return g(P.moon);
    case 'sun': return `<circle cx="32" cy="32" r="7" fill="${fg}"/><g stroke="${fg}" stroke-width="2.6" stroke-linecap="round"><path d="M32 17v4M32 43v4M17 32h4M43 32h4M21.4 21.4l2.8 2.8M39.8 39.8l2.8 2.8M21.4 42.6l2.8-2.8M39.8 24.2l2.8-2.8"/></g>`;
    case 'fullmoon': return `<circle cx="32" cy="32" r="12" fill="${fg}"/><circle cx="27.5" cy="28.5" r="2.6" fill="#2F3524" opacity=".25"/><circle cx="36" cy="36.5" r="2" fill="#2F3524" opacity=".25"/>`;
    case 'trio': return `<g fill="${fg}"><circle cx="21" cy="26" r="4.6"/><circle cx="32" cy="22.5" r="5"/><circle cx="43" cy="26" r="4.6"/><path d="M14 44c0-6 3-9 7-9s7 3 7 9zM25 44c0-7 3-11 7-11s7 4 7 11zM36 44c0-6 3-9 7-9s7 3 7 9z"/></g>`;
    case 'foot': return `<g fill="${fg}"><ellipse cx="26" cy="37" rx="5" ry="8" transform="rotate(-12 26 37)"/><ellipse cx="39" cy="29" rx="4.6" ry="7.5" transform="rotate(12 39 29)"/><circle cx="22.5" cy="25.5" r="2"/><circle cx="27.5" cy="24.5" r="1.8"/><circle cx="36" cy="17.5" r="1.8"/><circle cx="41.5" cy="18" r="1.9"/></g>`;
  }
  return '';
}
function medal(b, on, size=64){
  if (!on){
    const inner = b.hidden ? `<text x="32" y="41" text-anchor="middle" font-size="24" font-weight="700" fill="var(--muted)">?</text>` : glyph(b.icon, 'var(--muted)');
    return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="var(--surface-2)" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 4"/><g opacity=".55">${inner}</g></svg>`;
  }
  const c = MEDAL[b.color];
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="${c.bg}"/><circle cx="32" cy="32" r="25.5" fill="none" stroke="${c.fg}" stroke-opacity=".28" stroke-width="1.5"/>${glyph(b.icon, c.fg)}</svg>`;
}

const UI = {view:'home', logMember:null, logPeriod:'week', logMonth:null, logYearEnd:null, logWeek:null, calMonth:null, badgeMember:null, otonaOpen:false, pin:'', theme:null, flow:null, exportText:'', editPick:null};

function autoTheme(){ const h = new Date().getHours(); return (h >= 17 || h < 6) ? 'night' : 'day'; }
function applyTheme(){
  const th = UI.theme || autoTheme();
  document.documentElement.classList.toggle('night', th === 'night');
  $('#meta-theme').setAttribute('content', th === 'night' ? '#171A14' : '#F3EEE3');
  $('#theme-btn').innerHTML = (th === 'night' ? ICON.moon + '夜の表示' : ICON.sun + '朝の表示') + (UI.theme ? '' : '（自動）');
}

let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

function openDialog(html){ $('#dialog').innerHTML = html; $('#overlay').classList.add('open'); const f = $('#dialog').querySelector('input,button,select,textarea'); if (f) f.focus({preventScroll:true}); }
function closeDialog(){ $('#overlay').classList.remove('open'); $('#dialog').innerHTML = ''; }
let confirmFn = null;
function confirmBox(text, okLabel, fn, danger){
  confirmFn = fn;

function renameDialog(target){
  const isPal = target === 'pal';

  openDialog(`<h3>${isPal ? 'キャラクターの名前' : '名前を変える'}</h3>
    <div class="field"><label for="rename-input">${isPal ? 'キャラクターの名前' : '表示する名前'}</label><input id="rename-input" maxlength="10" value="${esc(cur)}" autocomplete="off"></div>
    <p class="small" id="rename-err" style="margin:0;color:var(--warn)" role="alert"></p>
    <div class="btnrow"><button class="btn" data-act="close" type="button">やめる</button><button class="btn primary" data-act="rename-save" data-target="${target}" type="button">保存</button></div>`);

}
function renameSave(target){
  const v = ($('#rename-input').value || '').trim();
  if (!v){ $('#rename-err').textContent = '名前を入れてください'; return; }
  if (target === 'pal') S.pal.name = v; else member(target).name = v;
  save(); closeDialog(); toast('名前を変えました'); render();
}

function render(){
  applyTheme();
  const n = new Date();
  $('#today-label').textContent = `${n.getMonth()+1}月${n.getDate()}日（${DAYS[n.getDay()]}）`;
  $('#tabs').innerHTML = VIEWS.map(v => `<button type="button" data-act="nav" data-view="${v.id}" ${UI.view === v.id ? 'aria-current="page"' : ''}>${ICON[v.icon]}${v.label}</button>`).join('');
  const A = analyze();
  const el = $('#view');
  if (UI.view === 'home') el.innerHTML = renderHome(A);
  else if (UI.view === 'kiroku'){ el.innerHTML = renderLog(A); drawCharts(A); }
  else if (UI.view === 'badge') el.innerHTML = renderBadges(A);
  else if (UI.view === 'chara') el.innerHTML = renderPal(A);
  else el.innerHTML = renderOtona(A);
}

const hasRecords = () => S.members.some(m => Object.keys(S.entries[m.id] || {}).length > 0);
function banners(){
  let h = '';
  if (S.demo) h += `<div class="banner"><span>いまは<b>デモデータ（18日分）</b>が入っています。こどもは「おやすみ中」なので、まず「おはよう」を押してみてください。</span><button class="btn small ghost" data-act="tut-start" type="button">家族で決めて本番をはじめる</button></div>`;
  if (!S.demo && !S.onboarded) h += `<div class="banner"><span>まだ家族の設定がおわっていません。名前・目標・役などを、家族で決めましょう。</span><button class="btn small primary" data-act="tut-start" type="button">家族で決める</button></div>`;
  if (!S.demo && S.onboarded && hasRecords() && diffDays(S.lastBackup || S.start, today()) >= 30) h += `<div class="banner"><span>前回のバックアップから30日以上たちました。おとな画面の「データ」から、ファイルに保存してください。</span><button class="btn small ghost" data-act="nav" data-view="otona" type="button">おとな画面へ</button></div>`;
  if (!storageOK) h += `<div class="banner"><span>この画面ではデータを保存できません。画面を閉じると記録が消えます。</span></div>`;
  return h;
}

function renderHome(A){
  const h = new Date().getHours();
  let hl, sub, img;
  if (h >= 5 && h < 11){ hl = 'おはよう。起きたら「おはよう」を押そう'; sub = '昨日の夜の点数とスタンプがもらえます'; img = 'wake'; }
  else if (h >= 11 && h < 17){ hl = '今夜の目標をチェックしておこう'; sub = '目標の時間は、カードの下に出ています'; img = 'stand'; }
  else if (h >= 17 && h < 21){ hl = 'ねる前に「おやすみ」を押してね'; sub = '歯みがきが終わったら、iPadを充電台に置いて布団へ'; img = 'teeth'; }
  else { hl = 'ねる時間です。「おやすみ」を押そう'; sub = '押したら、iPadを充電台に置いてから布団へ'; img = 'futon'; }
  let extra = '';
  const L = leaders(), lnames = L.map(m => esc(m.name)).join('・');
  if (h >= 15 || h < 5){
    const tn = tonight(), dec = S.declares[tn], nowOff = offAt(tn, new Date()), dt = clockToOff(S.declareTime);
    if (dec){
      const dm = member(dec.mid);
      hl = 'おやすみタイム中'; sub = `${esc(dm ? dm.name : '')}が${offToClock(dec.at)}に宣言しました。画面を消して、ねる準備をしよう。ねる前に「おやすみ」を押してね`;
    } else if (L.length && nowOff >= dt){
      hl = 'おやすみタイムの時間です'; sub = `おやすみリーダーの${lnames}、宣言しよう（${S.declareTime}）`; img = 'bell';
      extra = `<div class="acts">${L.map(m => `<button class="btn primary" data-act="declare" data-mid="${m.id}" type="button">${ICON.bell}${esc(m.name)}が宣言する</button>`).join('')}</div>`;
    } else {
      const nx = prepHero(tn, nowOff); if (nx){ hl = nx.hl; sub = nx.sub; img = nx.img; }
      if (L.length && (h >= 17 || h < 5)) extra = `<p class="sub2">今夜のおやすみタイム ${S.declareTime}（リーダー：${lnames}）</p><div class="acts">${L.map(m => `<button class="btn small ghost" data-act="declare" data-mid="${m.id}" type="button">${ICON.bell}早めに宣言する</button>`).join('')}</div>`;
    }
  } else if (h >= 5 && h < 11){
    const C = S.members.filter(m => m.job === 'check');
    if (C.length){
      const ln = A.upto;
      extra = `<div class="checkline"><span class="lbl">朝のチェック（${C.map(m => esc(m.name)).join('・')}）</span>${S.members.map(m => { const e = S.entries[m.id][ln]; const ok = e && e.wk != null; return `<span class="c ${ok ? 'ok' : ''}">${esc(m.name)} ${ok ? '済' : 'まだ'}</span>`; }).join('')}</div>`;
    }
  }
  const wi = homeWeek(A);
  return banners() + `<div class="hero"><div><p class="hl">${hl}</p><p class="sub">${sub}</p>${extra}</div>${pic(img, '', '')}</div>
    ${prepBlock()}
    <div class="cards">${S.members.map((m,i) => memberCard(A, m, i)).join('')}</div>
    ${weekBlock(A, wi)}
    ${rewardsBlock(A, wi)}`;
}

function prepHero(tn, nowOff){
  const ALL = prepAll(), log = S.prep.log[tn] || {};
  const idx = ALL.findIndex(t => t.kind !== 'free' && log[t.id] == null);
  if (idx < 0) return null;
  const t = ALL[idx], prev = ALL[idx - 1];
  if (prev && prev.kind === 'free' && nowOff >= clockToOff(prev.from) && nowOff < clockToOff(prev.dl))
    return {hl:'自由時間です', sub:`${prev.dl}まで、すきなことをしていい時間。つぎは「${esc(t.name)}」`, img:'reading'};
  return {hl:`つぎは「${esc(t.name)}」`, sub:`${t.dl}までにおわらせよう（${esc(whoName(t))}）`, img: PREP_IMG[t.icon] || 'stand'};
}
function prepBlock(){
  const h = new Date().getHours();
  if (!(h >= 15 || h < 5)) return '';
  const ALL = prepAll(), T = ALL.filter(t => t.kind !== 'free'); if (!T.length) return '';
  const n = tonight(), log = S.prep.log[n] || {}, wi = weekIndex(n), nowOff = offAt(n, new Date());
  const next = T.find(t => log[t.id] == null);
  const rows = ALL.map(t => {
    if (t.kind === 'free') return `<div class="prow free">${tile(t.icon, 40)}<span class="pn">${esc(t.name)}</span><span class="pw">みんな</span><span class="ps">${t.from}〜${t.dl}　すきなことをしていい時間</span></div>`;
    const done = log[t.id], dlo = clockToOff(t.dl);
    let st, over = false;
    if (done != null){ const diff = done - dlo; st = `${offToClock(done)}におわった` + (wi >= 1 ? (diff <= 0 ? '・予定どおり' : `・${diff}分おくれ`) : ''); }
    else if (nowOff > dlo && wi >= 1){ st = `${t.dl}まで（時間をすぎています）`; over = true; }
    else st = `${t.dl}まで`;
    return `<button class="prow ${done != null ? 'done' : ''} ${t === next ? 'next' : ''}" data-act="prep" data-tid="${t.id}" type="button" aria-pressed="${done != null}">${tile(t.icon, 40)}<span class="pn">${esc(t.name)}${t === next ? '<em>つぎ</em>' : ''}</span><span class="pw">${esc(whoName(t))}</span><span class="ps ${over ? 'over' : ''}">${st}</span><span class="pc">${done != null ? ICON.check : ''}</span></button>`;
  }).join('');
  const cnt = T.filter(t => log[t.id] != null).length, ok = prepOK(n);
  return `<section class="block" style="margin-top:0;margin-bottom:16px"><div class="panel stack" style="gap:12px">
    <div class="prep-head"><h2>今夜のじゅんび</h2><span class="muted small" style="font-weight:700">${cnt} / ${T.length}　おわったら押してね${wi === 0 ? '（1週目は時間を記録するだけ）' : ''}</span></div>
    <div class="prep-bar" aria-hidden="true"><i style="width:${Math.round(cnt / T.length * 100)}%"></i></div>
    ${ok ? `<div class="getbox">${pic('allcheck')}<div><b>準備バッチリ</b><br>${esc(child().name)}のじゅんびが、全部おわりました</div></div>` : ''}
    <div class="prep-list">${rows}</div></div></section>`;
}
function memberCard(A, m, i){
  const a = A.members[m.id], E = S.entries[m.id];
  const ln = A.upto, e = E[ln], sc = a.score[ln];
  const pend = pendingNight(m.id);
  const wi = A.curWeek, step = a.steps[wi];
  const h = new Date().getHours();
  let body = '';
  if (pend){
    body += `<div class="sleeping">${pic('curl')}<div><b>おやすみ中 ${offToClock(E[pend].lo)}〜</b><span>起きたら「おはよう」を押すと点数が出ます</span></div></div>`;
  } else if (e && (e.lo != null || e.wk != null)){
    body += `<dl class="last">
      <dt>${mdwText(ln)}の夜</dt><dd>${sc ? pawsHTML(pawsOf(sc.total)) + ' ' + sc.total + '点' : '—'}</dd>
      <dt>ねた時間</dt><dd>${e.lo != null ? offToClock(e.lo) : '—'}</dd>
      <dt>起きた時間</dt><dd>${e.wk != null ? offToClock(e.wk) : '—'}</dd>
      <dt>すいみん</dt><dd>${sc ? durText(sc.dur) : '—'}</dd></dl>`;
  } else {
    body += `<p class="muted small" style="margin:0">昨日の夜の記録はまだありません</p>`;
  }
  const tn = tonight();
  const goal = wi === 0 ? `今週は<b>記録するだけ</b>でスタンプ`
    : `今夜の目標　<b>${offToClock(step + (isWeekendNight(tn) ? 30 : 0))}</b>までにおやすみ${isWeekendNight(tn) ? '（明日休みなので30分おそくてOK）' : ''}`;
  const primaryWake = !!pend || (h >= 5 && h < 12 && !(e && e.wk != null));
  const ticketLeft = a.ticketUsed[wi] ? 0 : 1;
  return `<article class="card mcard" style="--mc:var(--m${i})">
    <div class="mhead"><div class="mname">${pic(avatarOf(m), 'avatar')}<span class="dot"></span><span class="nm">${esc(m.name)}</span><button class="pencil" data-act="rename" data-target="${m.id}" aria-label="${esc(m.name)}の名前を変える" type="button">${ICON.pencil}</button></div><span class="lv">Lv${a.lv.L}</span></div>
    <button class="job" data-act="job-info" data-mid="${m.id}" type="button">${tile(JOB_ICON[m.job] || 'paw', 22)}${esc(jobName(m))}</button>
    ${body}
    <div class="goal">${goal}</div>
    <div class="meta"><span>${ICON.flame}連続 ${a.streak}日</span><button data-act="ticket-info" data-mid="${m.id}" type="button">${ICON.ticket}おやすみチケット ${ticketLeft}枚</button></div>
    <div class="btnrow">
      <button class="btn ${primaryWake ? '' : 'primary'}" data-act="sleep" data-mid="${m.id}" type="button">${ICON.moon}おやすみ</button>
      <button class="btn ${primaryWake ? 'primary' : ''}" data-act="wake" data-mid="${m.id}" type="button">${ICON.sun}おはよう</button>
    </div>
  </article>`;
}

function weekBlock(A, wi){
  const nights = weekNights(wi), tn = tonight();
  const head = nights.map(d => { const dd = dparse(d); return `<div class="h ${d === tn ? 'today' : ''}">${DAYS[dd.getDay()]}<br>${dd.getMonth()+1}/${dd.getDate()}</div>`; }).join('');
  const slot = (on, future, kind) => future ? `<div class="slot future"></div>`
    : `<div class="slot ${on ? 'on' : ''}" aria-label="${on ? 'スタンプあり' : 'スタンプなし'}">${on ? (kind === 'house' ? houseOn() : pawOn()) : ''}</div>`;
  const rows = S.members.map((m,i) => `<div class="who" style="--mc:var(--m${i})"><span class="dot"></span>${esc(m.name)}</div>` + nights.map(d => slot(A.members[m.id].stamp[d], d > tn, 'paw')).join('')).join('');
  const fam = `<div class="who">${ICON.house}家族</div>` + nights.map(d => slot(A.family[d], d > tn, 'house')).join('')
    + `<div class="who">${ICON.check}じゅんび</div>` + nights.map(d => d > tn ? `<div class="slot future"></div>` : `<div class="slot ${prepOK(d) ? 'on' : ''}" aria-label="${prepOK(d) ? '準備バッチリ' : ''}">${prepOK(d) ? checkOn() : ''}</div>`).join('');
  return `<section class="block"><div class="sechead"><h2>今週のスタンプ（${wi+1}週目）</h2><span class="muted small">${mdText(nights[0])}〜${mdText(nights[6])}の夜　${wi === 0 ? '1週目は記録できたらスタンプ' : '目標を守れたらスタンプ'}</span></div>
    <div class="panel scroll-x"><div class="wtable"><div></div>${head}${rows}${fam}</div></div></section>`;
}

function rewardsBlock(A, wi){
  const c = child(), a = A.members[c.id];
  const cnt = weekStampCount(A, c.id, wi), claimed = S.rewards.weekly[wi];
  const pips = [0,1,2,3].map(i => `<span class="pip ${i < cnt ? 'on' : ''}">${i < cnt ? pawOn(20) : ''}</span>`).join('');
  let wk;
  if (cnt >= 4) wk = claimed ? `<div class="big">${esc(claimed.choice)}</div><p class="muted small" style="margin:0">今週のごほうびに決まりました</p>`
    : `<div class="pal-mini">${pic('reward')}<div class="big">ごほうびゲット</div></div><button class="btn primary" data-act="pick-weekly" data-wi="${wi}" type="button">ごほうびを選ぶ</button>`;
  else wk = `<div class="big">あと${4-cnt}つ</div><p class="muted small" style="margin:0">7日のうち4日スタンプでごほうび</p>`;
  let prev = '';
  if (wi > 0 && weekStampCount(A, c.id, wi-1) >= 4 && !S.rewards.weekly[wi-1]) prev = `<button class="btn small ghost" data-act="pick-weekly" data-wi="${wi-1}" type="button">先週のごほうびを選ぶ</button>`;
  const mk = tonight().slice(0,7), mon = Number(mk.slice(5,7));
  const fc = monthFamilyCount(A, mk), mclaim = S.rewards.monthly[mk];
  let mt;
  if (fc >= 10) mt = mclaim ? `<div class="pal-mini">${pic('outing')}<div class="big">${esc(mclaim.choice)}</div></div><p class="muted small" style="margin:0">今月のおでかけ先に決まりました</p>` : `<div class="pal-mini">${pic('family')}<div class="big">イベント決定</div></div><button class="btn primary" data-act="pick-monthly" data-mk="${mk}" type="button">行き先を決める</button>`;
  else mt = `<div class="pal-mini">${pic('family')}<div style="flex:1"><div class="big">${fc} / 10</div><div class="gauge" aria-hidden="true"><i style="width:${Math.min(100, fc*10)}%"></i></div></div></div><p class="muted small" style="margin:0">${esc(S.monthlyReward)}</p>`;
  const lv = a.lv;
  return `<section class="block"><div class="sechead"><h2>ごほうび</h2></div><div class="rewards">
    <div class="card rcard"><h3>${esc(c.name)}の今週のごほうび</h3><div class="pips">${pips}</div>${wk}${prev}</div>
    <div class="card rcard"><h3>家族の${mon}月のイベント（家族スタンプ）</h3>${mt}</div>

    const hits = bands(s, ml, mt, band, ih, mb);
    for (let v = lo; v <= hi; v += 30){ s.v += `<line class="grid" x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${ml-8}" y="${y(v)+4}" text-anchor="end">${offToClock(v)}</text>`; }
    s.v += `<line class="ref2" x1="${ml}" x2="${W-mr}" y1="${y(final)}" y2="${y(final)}"/><text class="rl" x="${W-mr+8}" y="${y(final)-16}">最終目標</text><text class="rl" x="${W-mr+8}" y="${y(final)-2}">${offToClock(final)}</text>`;
    if (pi.P !== 'year'){
      let any = false;
      items.forEach((it, i) => { if (it.tgt == null || it.tgt === final) return; any = true; const x0 = ml + band*i; s.v += `<line class="ref" x1="${x0 + Math.min(6, band*0.15)}" x2="${x0 + band - Math.min(6, band*0.15)}" y1="${y(it.tgt)}" y2="${y(it.tgt)}"/>`; });
      if (any && pi.P === 'week') s.v += `<text class="rl" x="${W-mr+8}" y="${y(items.find(it => it.tgt != null).tgt)+13}">今週の</text><text class="rl" x="${W-mr+8}" y="${y(items.find(it => it.tgt != null).tgt)+28}">目標</text>`;
    }
    let path = '', pts = '', prevOk = false;
    const r = N > 14 ? 3.5 : 5.5;
    items.forEach((it, i) => {
      const cx = ml + band*i + band/2;
      if (it.lo != null){ path += (prevOk ? ' L' : ' M') + `${cx},${y(it.lo)}`; pts += `<circle cx="${cx}" cy="${y(it.lo)}" r="${r}" fill="var(--mc)" stroke="var(--surface)" stroke-width="2"/>`; prevOk = true; }
      else prevOk = false;
    });
    s.v += `<path d="${path}" fill="none" stroke="var(--mc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` + pts;
    xlabels(s, ml, band, H, mb);
    elL.innerHTML = s.v + hits + `</svg><div class="tip"></div>`;
    attachTips(elL);
  }
}

/* 吹き出し（文字だけ。音声は使わない） */
const bubble = kind => `<div class="bubble">${kind === 'sleep' ? 'おやすみにゃ' : 'おはようにゃ'}</div>`;

/* ---------- 記録の流れ ---------- */
function doSleep(mid){
  const m = member(mid), n = new Date(), d = nightOf(n), off = offAt(d, n), E = S.entries[mid], e = E[d];
  const go = () => { E[d] = Object.assign({}, E[d] || {}, {lo: off, src: 'tap'}); delete E[d].wk; save(); closeDialog(); showNight(m, d, off); render(); };
  if (e && e.lo != null) confirmBox(`もう「おやすみ」を押しています（${offToClock(e.lo)}）。いまの時間（${offToClock(off)}）で記録しなおしますか？`, '記録しなおす', go);
  else go();
}
let nightTimer;
function showNight(m, d, off){
  const A = analyze(), a = A.members[m.id], wi = weekIndex(d);
  let msg;
  if (wi <= 0) msg = '明日の朝、記録スタンプがもらえます';
  else if (a.steps[wi] != null && off <= a.steps[wi] + (isWeekendNight(d) ? 30 : 0)) msg = '目標に間に合いました。スタンプは明日の朝に';
  else msg = 'ゆっくり休んでね';
  let tw = '';
  for (let i = 0; i < 26; i++) tw += `<span class="tw" style="left:${(i*37)%100}%;top:${(i*53)%90}%;animation-delay:${(i%7)*0.45}s"></span>`;
  const el = $('#nightsky');
  el.innerHTML = `${tw}${bubble('sleep')}${pic('charge')}<p class="nt">おやすみ、${esc(m.name)}</p><p>${offToClock(off)}に記録しました</p><p>${msg}</p><p class="hint">iPadを充電台に置いてから布団へ<br>（タップで閉じる）</p>`;
  el.classList.add('open');
  clearTimeout(nightTimer); nightTimer = setTimeout(() => el.classList.remove('open'), 9000);
}
function doWake(mid){
  const m = member(mid), n = new Date(), E = S.entries[mid];
  const pend = pendingNight(mid);
  if (pend){ UI.flow = {mid, d: pend, lo: E[pend].lo, wk: offAt(pend, n), src:'tap'}; return moodDialog(); }
  const d = lastNight(), e = E[d];
  const nowOff = offAt(d, n);
  if (e && e.wk != null){
    confirmBox(`${mdwText(d)}の夜は、もう「おはよう」を押しています。いまの時間で記録しなおしますか？`, '記録しなおす', () => {
      if (e.lo != null && nowOff > e.lo && nowOff < 1440){ UI.flow = {mid, d, lo: e.lo, wk: nowOff, src:'tap'}; moodDialog(); }
      else manualDialog(m, d, e);
    });
    return;
  }
  manualDialog(m, d, e);
}
function manualDialog(m, d, e){
  const n = new Date(), h = n.getHours();
  const wkDefault = (h >= 4 && h < 12) ? `${pad(h)}:${pad(n.getMinutes())}` : m.wake;
  UI.flow = {mid: m.id, d, src:'hand'};
  openDialog(`<h3>${esc(m.name)}、${mdwText(d)}の夜の時間を入れてね</h3>
    <p class="muted small" style="margin:0">「おやすみ」を押し忘れたときは、ここで入れます</p>
    <div class="form-grid"><div class="field"><label for="man-lo">ねた時間</label><input id="man-lo" type="time" value="${e && e.lo != null ? offToClock(e.lo) : m.lo}"></div>
    <div class="field"><label for="man-wk">起きた時間</label><input id="man-wk" type="time" value="${wkDefault}"></div></div>
    <p class="small" id="man-err" style="margin:0;color:var(--warn)" role="alert"></p>
    <div class="btnrow"><button class="btn" data-act="close" type="button">やめる</button><button class="btn primary" data-act="man-next" type="button">次へ</button></div>`);
}
function moodDialog(){
  const m = member(UI.flow.mid);
  openDialog(`<h3>おはよう、${esc(m.name)}。けさの気分は？</h3>
    <div class="moods">${[1,2,3].map(k => `<button class="btn" data-act="mood" data-k="${k}" type="button">${pic(['','face_good','face_ok','face_sleepy'][k])}${MOOD_LABEL[k]}</button>`).join('')}</div>
    <button class="btn ghost small" data-act="close" type="button">やめる</button>`);
}
function finishWake(k){
  const f = UI.flow; if (!f) return;
  const m = member(f.mid), c = child();
  const before = analyze(), bA = before.members[f.mid];
  const wiN = weekIndex(f.d), mk = f.d.slice(0,7);
  const prevWeek = weekStampCount(before, c.id, wiN), prevFam = monthFamilyCount(before, mk), prevLv = bA.lv;
  S.entries[f.mid][f.d] = Object.assign({}, S.entries[f.mid][f.d] || {}, {lo: f.lo, wk: f.wk, mood: k, src: f.src});
  const A = analyze();
  const fresh = unlockBadges(A, today());
  save();
  UI.flow = null;
  resultDialog(m, f.d, A, prevLv, (fresh[f.mid] || []), {prevWeek, prevFam, wiN, mk, isChild: m.id === c.id});
  render();
}
function resultDialog(m, d, A, prevLv, newBadges, ctx){
  const a = A.members[m.id], sc = a.score[d], e = S.entries[m.id][d];
  if (!sc){ closeDialog(); return; }
  const n = pawsOf(sc.total), wi = weekIndex(d), stamped = a.stamp[d];
  const t = stepTonight(a);
  let scene = 'stand', note = '';
  if (stamped) scene = 'stamp';
  else if (sc.total >= 70) scene = 'wake';
  else if (sc.total >= 50) scene = 'stretch';
  else if (ctx.isChild){ scene = 'yawn'; note = `ねぶそくだと、授業中にこうなっちゃうかも。${t != null ? `今夜は${offToClock(t)}までにおやすみしよう` : '今夜は早めにね'}`; }
  else { scene = 'laptop'; note = `夜ふかしはほどほどに。${t != null ? `今夜は${offToClock(t)}までに` : ''}`; }
  let h = `${bubble('wake')}${pic(scene, 'scene', S.pal.name)}${note ? `<p class="scene-note">${note}</p>` : ''}
    <h3 class="center">おはよう、${esc(m.name)}</h3>
    <div class="rscore"><div class="rpaws">${[0,1,2].map(i => `<span style="animation-delay:${.15 + i*.22}s">${i < n ? pawOn(40) : pawOff(40)}</span>`).join('')}</div>
    <div class="score-big">${sc.total}<small>点</small></div></div>
    <div class="breakdown"><span>ねた時間 <b>${sc.sLo}</b>/50</span><span>すいみん <b>${sc.sSl}</b>/40</span><span>起きた時間 <b>${sc.sWk}</b>/10</span></div>
    <p class="center small muted" style="margin:0">${offToClock(e.lo)}にねて、${offToClock(e.wk)}に起きた（${durText(sc.dur)}）</p>`;
  if (stamped){
    h += `<div class="getbox">${pawOn(40)}<div><b>${wi <= 0 ? '記録スタンプ' : '自分のスタンプ'}ゲット</b></div></div>`;
    if (A.family[d]) h += `<div class="getbox">${pic('family')}<div><b>家族スタンプもゲット</b><br>3人とも目標をクリアしました</div></div>`;
  } else if (wi >= 1 && a.ticketUsed[wi] === d) {

function doDeclare(mid){
  const m = member(mid), n = new Date(), d = tonight(), off = offAt(d, n);
  S.declares[d] = {mid, at: off};
  const fresh = unlockBadges(analyze(), today());
  save();
  const chargers = S.members.filter(x => x.job === 'charge').map(x => esc(x.name)).join('・');
  let h = `${pic('bell', 'scene', S.pal.name)}<h3 class="center">おやすみタイムです</h3>
    <p class="center" style="margin:0">おやすみリーダーの${esc(m.name)}が、${offToClock(off)}に宣言しました。</p>
    <ul class="promise">
      <li>${ICON.check}テレビ・スマホ・ゲームはおしまい</li>
      <li>${ICON.check}歯みがきをして、ねる準備をはじめる</li>
      <li>${ICON.check}iPadとスマホは充電台へ${chargers ? `（充電台係：${chargers}）` : ''}</li>
    </ul>`;
  { const T = prepTasks(), L = S.prep.log[d] || {}, rest = T.filter(t => L[t.id] == null);
    if (T.length) h += `<div class="getbox plain"><div style="flex:1">${rest.length ? `<b>のこりのじゅんび</b><div class="row" style="gap:8px;margin-top:6px">${rest.map(t => `<span class="row" style="gap:6px">${tile(t.icon, 28)}${esc(t.name)}</span>`).join('')}</div>` : 'じゅんびは全部おわっています'}</div></div>`; }
  const nb = fresh[mid] || [];
  if (nb.length) h += `<div class="getbox">${pic('badge')}<div style="flex:1"><b>新しいバッジ</b><div class="badgelist">${nb.map(b => `<div>${medal(b, true, 34)}<span><b>${b.name}</b>　${b.desc}</span></div>`).join('')}</div></div></div>`;
  h += `<button class="btn primary" data-act="close" type="button">わかった</button>`;
  openDialog(h);
  render();
}

    members: S.members.map(m => ({id:m.id, role:m.role, name:m.name, wake:m.wake, sleep:m.sleep, job:m.job, jobName:m.jobName || '', jobTask:m.jobTask || '', avatar:avatarOf(m)})),

function closeTut(){ $('#tut').classList.remove('open'); $('#tut').innerHTML = ''; document.body.style.overflow = ''; UI.tut = null; }
const tutBed = dm => minusClock(dm.wake, dm.sleep);
function tutInput(t){
  if (!UI.tut || !t.dataset || !t.dataset.tf) return;
  const d = UI.tut.d, i = t.dataset.i != null ? Number(t.dataset.i) : null, f = t.dataset.tf, v = t.value;
  if (f.startsWith('p-')){
    const pi = Number(t.dataset.pi), tk = d.prep[pi]; if (!tk) return;
    if (f === 'p-name'){ tk.name = v; return; }
    if (t.tagName === 'INPUT' && t.type === 'checkbox' && t.dataset.tf === 'p-on'){ if (t.checked === tk.on) return; tk.on = t.checked; }
    else if (f === 'p-dur'){ if (Number(v) === tk.dur) return; tk.dur = Number(v); }
    else if (f === 'p-who'){ tk.who = v; return; }
    else return;
    renderTut(); return;
  }
  if (f === 'pal') d.pal = v;
  else if (f === 'decl'){ d.declareTime = v; d.declTouched = true; }
  else if (f === 'monthly') d.monthly = v;
  else if (i != null){
    const dm = d.members[i];
    if (f === 'sleep') dm.sleep = Number(v); else dm[f] = v;
    if (f === 'wake' || f === 'sleep'){
      const c = $('#tc-' + i); if (c && dm.wake) c.textContent = tutBed(dm);
      const w = $('#tw-' + i); if (w) w.textContent = (dm.role === 'child' && dm.sleep < 540) ? '小学生の目安（9〜12時間）より短くなっています' : '';
    }
    if (f === 'job'){
      const tk = $('#tj-' + i); if (tk) tk.textContent = v === 'custom' ? 'やることを下に書いてください' : JOBS[v].task;
      const cc = $('#tjc-' + i); if (cc) cc.hidden = v !== 'custom';
      const ic = $('#tji-' + i); if (ic) ic.innerHTML = pic(JOB_IMG[v] || 'stand');
    }
  }
}
function tutNext(){
  const st = TUT_STEPS[UI.tut.step], d = UI.tut.d;
  if (st === 'names'){
    if (d.members.some(m => !m.name.trim()) || !d.pal.trim()){ toast('名前をすべて入れてください'); return; }
  }
  if (st === 'goals' && d.members.some(m => !m.wake)){ toast('起きる時間をすべて入れてください'); return; }
  if (st === 'jobs' && d.members.some(m => m.job === 'custom' && !m.jobName.trim())){ toast('「自分で決める」を選んだ人は、役の名前を入れてください'); return; }
  if (st === 'time' && !d.declareTime){ toast('おやすみタイムを入れてください'); return; }
  if (st === 'prep' && d.prep.some(t => t.on && !t.name.trim())){ toast('じゅんびの名前を入れてください'); return; }
  if (UI.tut.only){ tutCommit(); return; }
  if (UI.tut.step < TUT_STEPS.length - 1){
    UI.tut.step++;
    if (TUT_STEPS[UI.tut.step] === 'time' && !d.declTouched && !S.onboarded) d.declareTime = minusClock(tutChildBed(), 30);
    renderTut(); return;
  }
  tutCommit();
}

/* ---------- バックアップ ---------- */
async function backupFile(){
  const name = `nemuri-note-${today()}.json`, text = JSON.stringify(S);
  const done = () => { S.lastBackup = today(); save(); toast('保存しました'); render(); };
  /* claude.ai の中で開いているときは、その保存機能を使う */
  if (window.claude && window.claude.use){
    let dl = null; try { dl = await window.claude.use('downloads'); } catch(e){}
    if (dl){
      try { await dl.save({filename:name, data:text}); done(); }
      catch(e){ if (!e || e.code !== 'declined') toast('この画面ではファイルに保存できません。「テキストで書き出す」を使ってください'); }
      return;
    }
  }
  try {
    const file = new File([text], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); done(); return; }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  try {
    const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    done();
  } catch(e){ toast('この画面ではファイルに保存できません。「テキストで書き出す」を使ってください'); }
}

/* ---------- デモデータ ---------- */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeDemo(){
  S = freshState(); S.demo = true;
  S.start = addDays(today(), -18);
  const rnd = mulberry32(20261117), r = (a,b) => a + Math.round(rnd()*(b-a));
  const c2o = c => c >= 720 ? c - 720 : c + 720;
  const mood = () => { const x = rnd(); return x < .55 ? 1 : x < .85 ? 2 : 3; };
  const kidBase = [22*60+35, 22*60+12, 21*60+52];
  const LAST = 17;
  for (let i = 0; i <= LAST; i++){
    const d = addDays(S.start, i), w = Math.floor(i/7), we = isWeekendNight(d);
    if (i !== 12){
      let lo = kidBase[w] + r(-10,10) + (we ? r(10,25) : 0);
      if (i === 9) lo += r(30,40);
      const wk = we ? 7*60 + r(5,30) : 6*60 + 30 + r(-6,4);
      S.entries.m1[d] = i === LAST ? {lo: c2o(lo), src:'tap'} : {lo: c2o(lo), wk: c2o(wk), mood: mood(), src:'tap'};
    }
    const plo = 22*60+50 + r(-15,20) + (we ? r(10,30) : 0), pwk = we ? 7*60 + r(0,30) : 6*60 + 20 + r(-8,8);
    S.entries.m2[d] = {lo: c2o(plo), wk: c2o(pwk), mood: mood(), src:'tap'};
    const mlo = 22*60+35 + r(-15,15) + (we ? r(10,25) : 0), mwk = we ? 6*60+50 + r(0,25) : 6*60 + 10 + r(-6,6);
    S.entries.m3[d] = {lo: c2o(mlo), wk: c2o(mwk), mood: mood(), src:'tap'};
  }
  for (let i = 7; i < LAST; i++){ if (i === 9 || i === 12) continue; S.declares[addDays(S.start, i)] = {mid:'m1', at: c2o(20*60 + 40 + r(0,15))}; }
  for (let i = 0; i <= LAST; i++){
    if (i === 12) continue;
    const d = addDays(S.start, i), w = Math.floor(i/7), good = (i === 15 || i === 16);
    const late = good ? 0 : [1, .75, .45][w];
    const L = {};
    prepTasks().forEach(t => {
      const dl = clockToOff(t.dl);
      const base = {hw:20, dinS:12, dinE:30, bath:38, pjs:36, futon:22, teeth:20}[t.id] || 10;
      L[t.id] = good ? dl - r(2,12) : dl + Math.round(base * late) + r(-8,8);
    });
    S.prep.log[d] = L;
  }
  for (let i = 0; i <= LAST; i++){ const d = addDays(S.start, i); unlockBadges(analyze(d), addDays(d, 1)); }
  const A = analyze();
  const c = child();
  if (weekStampCount(A, c.id, 0) >= 4) S.rewards.weekly[0] = {choice: S.menu[0], date: addDays(S.start, 7)};
  if (weekStampCount(A, c.id, 1) >= 4) S.rewards.weekly[1] = {choice: S.menu[2], date: addDays(S.start, 14)};
  save();
}

  tutInput(ev.target);
  if (ev.target.dataset && ev.target.dataset.jobsel != null){ const c = $('#f-custom-' + ev.target.dataset.jobsel); if (c) c.hidden = ev.target.value !== 'custom'; }
  if (ev.target.id === 'f-file' && ev.target.files && ev.target.files[0]){
    const fr = new FileReader();
    fr.onload = () => { $('#f-import').value = String(fr.result || ''); };
    fr.readAsText(ev.target.files[0]);
  }
  if (ev.target.id === 'f-e-mid' || ev.target.id === 'f-e-d'){
    UI.editPick = {mid: $('#f-e-mid').value, d: $('#f-e-d').value || lastNight()}; render();
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'tut-prep-new'){ ev.preventDefault(); const b = document.querySelector('[data-act="tut-prep-add"]'); if (b) b.click(); return; }
  if (ev.key === 'Enter' && ev.target.id === 'tut-menu-new'){ ev.preventDefault(); const b = document.querySelector('[data-act="tut-menu-add"]'); if (b) b.click(); return; }
  if (ev.key === 'Enter' && ev.target.id === 'rename-input'){ ev.preventDefault(); const b = $('[data-act="rename-save"]'); if (b) renameSave(b.dataset.target); return; }
  if (ev.key === 'Escape'){ closeDialog(); UI.flow = null; $('#nightsky').classList.remove('open'); }
});
let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (UI.view === 'kiroku') drawCharts(analyze()); }, 150); });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.some(x => x.id === v) && v !== UI.view){ UI.view = v; render(); } });

/* ---------- 起動 ---------- */
const loaded = loadState();
if (loaded && loaded.demo && !(loaded.prep && loaded.prep.v === 3)) makeDemo();
else if (loaded){ S = migrate(loaded); save(); } else { S = freshState(); save(); }
const hv = location.hash.slice(1);
if (VIEWS.some(x => x.id === hv)) UI.view = hv;
render();
if (!S.demo && !S.onboarded && !hasRecords()) openTut();
setInterval(() => { if (!$('#overlay').classList.contains('open') && UI.view === 'home') render(); }, 5*60*1000);
})();
</script>
</body>
</html>
